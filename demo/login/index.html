<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smartschool Combined demo: aanmelden</title><style>body{margin:0;font:14px system-ui,sans-serif;background:#f1f3f6;color:#4a4a4a}#smscMain{min-height:100vh;display:flex}.login-app{flex:1;display:flex;background:#e9edf2}.login-app__container{flex:1;display:flex}.login-app__left{flex:1;background:linear-gradient(135deg,#ff7a3d,#ff520e 60%,#c43a00)}.login-app__right{width:460px;display:flex;flex-direction:column;justify-content:center;padding:40px;background:#fff}.logintitle{color:#2d2d2d;font-size:26px;margin:0 0 18px}.float-label{position:relative;margin:14px 0}.float-label__input{width:100%;box-sizing:border-box;height:46px;padding:16px 12px 4px;border:1px solid #cfd5dc;border-radius:4px;background:#fff;color:#333;font:inherit}.float-label__label{position:absolute;left:12px;top:4px;font-size:11px;color:#8a8f96}.smscButton.blue{display:block;width:100%;height:42px;border:0;border-radius:4px;background:#2b7bd6;color:#fff;font:600 14px system-ui;cursor:pointer;margin-top:10px}.demo-box{background:#fff8d6;border:1px solid #e6d98a;color:#5b4b00;padding:10px 12px;border-radius:6px;margin:0 0 18px;font-size:13px}#err{color:#c00;margin-top:10px;min-height:18px}</style></head><body><div id="smscMain" class="showLeftNav"><div class="login-app"><div class="login-app__container"><div class="login-app__left"></div><div class="login-app__right"><div class="login-app__top"><div class="login-app__platform-indicator"><h1 class="logintitle">Sint-Testschool</h1></div><div class="demo-box">Demo van Smartschool Combined: nagemaakte aanmeldpagina. Gebruik <b>demo</b> als gebruikersnaam en <b>demo</b> als wachtwoord. Dit zijn geen echte Smartschool-gegevens.</div><div class="login-app__form"><form class="form" id="f"><div class="float-label"><input class="float-label__input" id="u" name="u" type="text" autocomplete="off"><label class="float-label__label" for="u">Gebruikersnaam</label></div><div class="float-label"><input class="float-label__input" id="p" name="p" type="password" autocomplete="off"><label class="float-label__label" for="p">Wachtwoord</label></div><button class="smscButton blue" type="submit">Aanmelden</button><div id="err"></div></form></div></div></div></div></div></div><script>document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();if(u.value==="demo"&&p.value==="demo"){sessionStorage.setItem("demoIn","1");location.href="/"}else{document.getElementById("err").textContent="Onjuiste gegevens. Gebruik demo en demo."}})</script></body></html>
